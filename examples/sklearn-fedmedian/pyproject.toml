[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sklearn-fedmedian-viz"
version = "1.1.11"
description = "Federated Learning with scikit-learn and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "flwr-datasets[vision]>=0.6.1",
    "scikit-learn>=1.6.1",
    "flwr-viz",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "sklearnexample.server_app:app"
clientapp = "sklearnexample.client_app:app"

[tool.flwr.app.config]
penalty = "l2"
num-server-rounds = 8
min-available-clients = 2
save-model = false
fraction-train = 0.6
fail-prob = 0.1
viz-url = "http://127.0.0.1:7878"
viz-level = "detailed"

# flwr-viz is not on PyPI yet; see examples/pytorch-fedavg/pyproject.toml.
[tool.uv.sources]
flwr-viz = { path = "/absolute/path/to/flwr-viz", editable = true }   # <- set this to where you cloned flwr-viz
